[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    real_vtk_check: run the real (crash-isolated) VTK/OpenGL probe instead of the default pass
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
